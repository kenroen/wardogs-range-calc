[package]
name = "wardogs-range-calc"
description = "WARDOGS artillery range calculator: range and bearing from game coordinates, fed from the clipboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11"] }
egui = "0.36"
arboard = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
