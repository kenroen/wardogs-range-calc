[package]
name = "wardogs-range-calc"
description = "WARDOGS artillery range calculator: range and bearing from game coordinates, fed from the clipboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "links"] }
egui = { version = "0.36", default-features = false }
clipboard-rs = "0.3"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
ron = "0.8"
