name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -match '(?m)^version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
            $tag = "v$version"
            "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Detected version: $version (tag: $tag)"
          } else {
            Write-Error "Failed to extract version from Cargo.toml"
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Lint with Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release assets and generate SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $exeName = "wardogs-range-calc.exe"
          $zipName = "wardogs-range-calc-$tag-windows-x64.zip"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/$exeName" "dist/$exeName"
          Compress-Archive -Path "dist/$exeName" -DestinationPath "dist/$zipName" -Force

          $exeHash = (Get-FileHash "dist/$exeName" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()

          $sums = "$exeHash  $exeName`n$zipHash  $zipName`n"
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", $sums)

          $notes = @(
            "### SHA-256 Checksums"
            ""
            "| File | SHA-256 |"
            "| :--- | :--- |"
            "| ``$exeName`` | ``$exeHash`` |"
            "| ``$zipName`` | ``$zipHash`` |"
          ) -join "`n"
          [System.IO.File]::WriteAllText("$PWD/dist/release-notes.md", $notes)

          Write-Host "--- SHA256SUMS.txt ---"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WARDOGS Range Calculator ${{ steps.version.outputs.tag }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          files: |
            dist/wardogs-range-calc.exe
            dist/wardogs-range-calc-${{ steps.version.outputs.tag }}-windows-x64.zip
            dist/SHA256SUMS.txt
